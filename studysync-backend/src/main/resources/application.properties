spring.application.name=studysync-backend
server.port=${PORT:8080}

# H2 In-Memory Database Connection (Fallback)
spring.datasource.url=jdbc:h2:mem:studysync1;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================
# Spring Data JPA / Hibernate Config
# ==========================
# Set to 'create' to drop and recreate tables on startup (WIPES DATA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================
# JWT Configuration
# ==========================
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# ==========================
# Logging Configuration
# ==========================
logging.level.org.springframework.security=INFO

# ==========================
# Cloudinary Configuration
# ==========================
# Replace with your actual Cloudinary credentials
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api_key=${CLOUDINARY_API_KEY:000000000}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:secret}

# ==========================
# File Upload Configuration
# ==========================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

